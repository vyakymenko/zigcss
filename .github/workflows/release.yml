name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: zigcss-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-preflight:
    name: Verify npm Publication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: read
    outputs:
      release-channel: ${{ steps.npm-policy.outputs.channel }}
      github-prerelease: ${{ steps.npm-policy.outputs.github_prerelease }}
      github-make-latest: ${{ steps.npm-policy.outputs.github_make_latest }}
      npm-already-published: ${{ steps.npm-policy.outputs.already_published }}
      npm-package-archive: ${{ steps.npm-package.outputs.archive-name }}
      npm-package-shasum: ${{ steps.npm-package.outputs.archive-shasum }}
      npm-package-integrity: ${{ steps.npm-package.outputs.archive-integrity }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify native zero-dependency package
        run: npm run test:preprocessor-package && npm run check:preprocessor-package

      - name: Verify packaged Node API
        run: npm run test:node-api

      - name: Verify synchronized release version for publication
        run: |
          npm run check:version -- --tag "$GITHUB_REF_NAME"
          node scripts/validate-native-integrity.mjs --check

      - name: Verify successful Build evidence for release commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          candidate_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          node scripts/verify-build-workflow-run.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$candidate_commit"

      - name: Verify clean CodeQL evidence for release commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          candidate_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          node scripts/verify-code-scanning-gate.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$candidate_commit"

      - name: Verify release candidate admission
        shell: bash
        run: |
          candidate_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          origin_main_commit="$(
            git ls-remote --exit-code --refs origin refs/heads/main |
              cut -f1
          )"
          node scripts/validate-release-admission.mjs --check \
            --release-tag "$GITHUB_REF_NAME" \
            --candidate-commit "$candidate_commit" \
            --origin-main-commit "$origin_main_commit"

      - name: Verify npm publication authority
        id: npm-policy
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          versions="$RUNNER_TEMP/zigcss-npm-versions.json"
          versions_attempt="$versions.attempt"
          for attempt in 1 2 3 4; do
            if timeout 30s npm whoami --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              echo "npm credential verification failed after 4 bounded attempts" >&2
              exit 1
            fi
            sleep 5
          done
          for attempt in 1 2 3 4; do
            if timeout 30s npm view zigcss versions --json --registry=https://registry.npmjs.org/ > "$versions_attempt"; then
              mv -- "$versions_attempt" "$versions"
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              echo "npm registry authority readback failed after 4 bounded attempts" >&2
              exit 1
            fi
            sleep 5
          done
          node scripts/check-npm-version-availability.mjs \
            --version "$version" \
            --versions-file "$versions" \
            --github-output "$GITHUB_OUTPUT"

      - name: Pack exact npm package
        id: npm-package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_directory="$RUNNER_TEMP/zigcss-npm-publication"
          pack_description="$RUNNER_TEMP/zigcss-npm-pack.json"
          mkdir "$package_directory"
          npm pack --ignore-scripts --json \
            --pack-destination "$package_directory" > "$pack_description"
          archive="$package_directory/zigcss-$version.tgz"
          node scripts/npm-package-artifact.mjs prepare \
            --archive "$archive" \
            --version "$version" \
            --pack-description "$pack_description" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify exact resumable npm publication
        if: steps.npm-policy.outputs.already_published == 'true'
        shell: bash
        env:
          NPM_PACKAGE_ARCHIVE: ${{ runner.temp }}/zigcss-npm-publication/${{ steps.npm-package.outputs.archive-name }}
        run: node scripts/verify-npm-publication.mjs --version "${GITHUB_REF_NAME#v}" --archive "$NPM_PACKAGE_ARCHIVE"

      - name: Upload exact npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publication-${{ github.sha }}
          path: ${{ runner.temp }}/zigcss-npm-publication/${{ steps.npm-package.outputs.archive-name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release ${{ matrix.target }}
    needs: npm-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-linux
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-linux
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-macos
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-15
            arch: aarch64
            target: aarch64-macos
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: windows-latest
            arch: x86_64
            target: x86_64-windows
            archive-extension: zip
            zig-version: 0.15.2
            binary-name: zigcss.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'

      - name: Download exact npm package for smoke
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-publication-${{ github.sha }}
          path: ${{ runner.temp }}/zigcss-npm-publication

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: ${{ matrix.zig-version }}

      - name: Verify synchronized release version
        shell: bash
        run: |
          npm run check:version -- --tag "$GITHUB_REF_NAME"
          npm run check:release-metadata

      - name: Build Release Binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Verify Target Architecture
        run: node scripts/verify-artifact-target.mjs zig-out/bin/${{ matrix.binary-name }} ${{ matrix.target }}

      - name: Plan Release Assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          epoch="$(node scripts/validate-native-integrity.mjs --print-source-date-epoch --version "$version")"
          base="zigcss-v${version}-${{ matrix.target }}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_BASE=$base" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=$base.${{ matrix.archive-extension }}" >> "$GITHUB_ENV"
          echo "RELEASE_SBOM=$base.spdx.json" >> "$GITHUB_ENV"
          echo "RELEASE_CHECKSUMS=$base.sha256" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Create Archive
        shell: bash
        run: |
          mkdir -p release-assets
          node scripts/create-release-archive.mjs \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Verify Committed Native Integrity
        shell: bash
        run: |
          node scripts/validate-native-integrity.mjs \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION"

      - name: Generate SHA-256 Manifest and SPDX SBOM
        shell: bash
        run: |
          node scripts/generate-release-metadata.mjs --write \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Verify Release Metadata
        shell: bash
        run: |
          node scripts/generate-release-metadata.mjs --check \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Smoke Native Archive and npm Installation
        shell: bash
        run: |
          node scripts/smoke-release-artifact.mjs \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --npm-package "$NPM_PACKAGE_ARCHIVE"
        env:
          NPM_PACKAGE_ARCHIVE: ${{ runner.temp }}/zigcss-npm-publication/${{ needs.npm-preflight.outputs.npm-package-archive }}

      - name: Attest Release Provenance
        id: provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            release-assets/${{ env.RELEASE_ARCHIVE }}
            release-assets/${{ env.RELEASE_SBOM }}
            release-assets/${{ env.RELEASE_CHECKSUMS }}

      - name: Attest Release SBOM
        id: sbom-attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-assets/${{ env.RELEASE_ARCHIVE }}
          sbom-path: release-assets/${{ env.RELEASE_SBOM }}

      - name: Preserve Signed Attestation Bundles
        shell: bash
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "release-assets/${RELEASE_BASE}.provenance.sigstore.jsonl"
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            "release-assets/${RELEASE_BASE}.sbom.sigstore.jsonl"

      - name: Verify Signed Attestation Bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/generate-release-metadata.mjs --check-bundles \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          gh attestation verify "release-assets/$RELEASE_ARCHIVE" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "release-assets/${RELEASE_BASE}.provenance.sigstore.jsonl" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify "release-assets/$RELEASE_ARCHIVE" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "release-assets/${RELEASE_BASE}.sbom.sigstore.jsonl" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "refs/tags/$GITHUB_REF_NAME" \
            --source-digest "$GITHUB_SHA"

      - name: Upload Release Assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zigcss-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Bound Zig cache
        if: always()
        run: node .github/actions/setup-zig/setup-zig.mjs --prune-cache

  create-release:
    name: Create Release
    needs: [npm-preflight, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: immutable-release
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'

      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: zigcss-*

      - name: Verify exact local release inventory
        shell: bash
        run: |
          node scripts/verify-github-release-assets.mjs \
            --assets-directory artifacts \
            --version "${GITHUB_REF_NAME#v}" \
            --phase local

      - name: Discover resumable GitHub release state
        id: github-release-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_discovery="$RUNNER_TEMP/zigcss-release-discovery.json"
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          timeout 60s gh api graphql \
            -f query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId,isDraft,isPrerelease,tagName}}}' \
            -f owner="$repository_owner" \
            -f name="$repository_name" \
            -f tag="$GITHUB_REF_NAME" > "$release_discovery"
          node scripts/verify-github-release-assets.mjs \
            --release-json "$release_discovery" \
            --github-output "$GITHUB_OUTPUT" \
            --version "${GITHUB_REF_NAME#v}" \
            --phase discovery

      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create verified draft release
        id: github-release
        if: steps.github-release-state.outputs.release-mode != 'published'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          body: |
            ## zigcss v${{ steps.version.outputs.VERSION }}

            Self-contained native ZigCSS binaries for CSS, SCSS, indented Sass, Less, and Stylus.

            Each platform archive is accompanied by a SHA-256 manifest, an SPDX 2.3 SBOM, a Sigstore-signed SLSA provenance bundle, and a signed SBOM bundle. Verify the downloaded archive against both its checksum manifest and GitHub artifact attestation before use.

            ### Installation

            Download the appropriate binary for your platform and add it to your PATH.

            ### Supported Platforms

            - Linux (x86_64, aarch64)
            - macOS (x86_64, aarch64)
            - Windows (x86_64)

            The same closed verified optimizer runs directly for CSS and after native frontend evaluation for SCSS, indented Sass, Less, and Stylus. It remains incompatible with source maps, and profiling remains CSS-only. The verified eight-feature target-prefix pass runs after frontend evaluation and any optimizer fixed point for all five syntaxes, requires a strict explicit six-browser minimum query, and does not claim general autoprefixing or Browserslist behavior. Executable preprocessor plugins and project code remain outside the native product contract. Broader compatibility data, alternate ecosystem adapters, and the public compile service retain their documented experimental or unavailable boundaries. Public performance comparisons are withdrawn until a controlled scheduled archive is selected and reproduced by the BENCH-007 publication gate.

          draft: true
          prerelease: ${{ needs.npm-preflight.outputs.github-prerelease }}
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Resolve exact GitHub release ID
        id: release-identity
        shell: bash
        env:
          CREATED_RELEASE_ID: ${{ steps.github-release.outputs.id }}
          DISCOVERED_RELEASE_ID: ${{ steps.github-release-state.outputs.release-id }}
          RELEASE_MODE: ${{ steps.github-release-state.outputs.release-mode }}
        run: |
          if [[ "$RELEASE_MODE" == published ]]; then
            release_id="$DISCOVERED_RELEASE_ID"
          else
            release_id="$CREATED_RELEASE_ID"
          fi
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub release state returned an invalid release ID" >&2
            exit 1
          fi
          if [[ "$RELEASE_MODE" == draft && "$release_id" != "$DISCOVERED_RELEASE_ID" ]]; then
            echo "GitHub release action did not reconcile the discovered draft ID" >&2
            exit 1
          fi
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Verify draft release identity and assets
        if: steps.github-release-state.outputs.release-mode != 'published'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release-identity.outputs.release-id }}
        run: |
          release_draft="$RUNNER_TEMP/zigcss-release-draft.json"
          for attempt in 1 2 3 4 5 6; do
            if timeout 30s gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$release_draft" && \
              node scripts/verify-github-release-assets.mjs \
                --release-json "$release_draft" \
                --assets-directory artifacts \
                --version "${GITHUB_REF_NAME#v}" \
                --phase draft; then
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              exit 1
            fi
            sleep 10
          done

      - name: Publish immutable GitHub release
        if: steps.github-release-state.outputs.release-mode != 'published'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_MAKE_LATEST: ${{ needs.npm-preflight.outputs.github-make-latest }}
          GITHUB_PRERELEASE: ${{ needs.npm-preflight.outputs.github-prerelease }}
          RELEASE_ID: ${{ steps.release-identity.outputs.release-id }}
        run: |
          tag_ref="$RUNNER_TEMP/zigcss-release-tag-ref.json"
          timeout 30s gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" > "$tag_ref"
          node scripts/verify-github-release-assets.mjs \
            --tag-ref-json "$tag_ref" \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --phase tag
          if ! timeout 30s gh api --method PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false \
              -F "prerelease=$GITHUB_PRERELEASE" \
              -f "make_latest=$GITHUB_MAKE_LATEST" \
              > "$RUNNER_TEMP/zigcss-release-publish-response.json"; then
            echo "GitHub release publication response was inconclusive; continuing to authoritative readback" >&2
          fi

      - name: Verify immutable release readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release-identity.outputs.release-id }}
        run: |
          release_published="$RUNNER_TEMP/zigcss-release-published.json"
          tag_ref="$RUNNER_TEMP/zigcss-release-published-tag-ref.json"
          for attempt in 1 2 3 4 5 6; do
            if timeout 30s gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" > "$tag_ref" && \
              timeout 30s gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$release_published" && \
              node scripts/verify-github-release-assets.mjs \
                --release-json "$release_published" \
                --assets-directory artifacts \
                --tag-ref-json "$tag_ref" \
                --version "${GITHUB_REF_NAME#v}" \
                --commit "$GITHUB_SHA" \
                --phase published; then
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              exit 1
            fi
            sleep 10
          done

      - name: Verify stable Latest release identity
        if: needs.npm-preflight.outputs.github-make-latest == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release-identity.outputs.release-id }}
        run: |
          release_latest="$RUNNER_TEMP/zigcss-release-latest.json"
          for attempt in 1 2 3 4 5 6; do
            if timeout 30s gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/latest" > "$release_latest" && \
              node scripts/verify-github-release-assets.mjs \
                --release-json "$release_latest" \
                --release-id "$RELEASE_ID" \
                --version "${GITHUB_REF_NAME#v}" \
                --phase latest; then
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              exit 1
            fi
            sleep 10
          done

      - name: Verify immutable release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release-identity.outputs.release-id }}
        run: |
          release_attestation="$RUNNER_TEMP/zigcss-release-attestation.json"
          for attempt in 1 2 3 4 5 6; do
            if timeout 30s gh release verify "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --format json > "$release_attestation" && \
              node scripts/verify-github-release-assets.mjs \
                --attestation-json "$release_attestation" \
                --assets-directory artifacts \
                --repository "$GITHUB_REPOSITORY" \
                --release-id "$RELEASE_ID" \
                --version "${GITHUB_REF_NAME#v}" \
                --commit "$GITHUB_SHA" \
                --phase attestation; then
              exit 0
            fi
            if [[ "$attempt" == 6 ]]; then
              exit 1
            fi
            sleep 10
          done

  publish-npm:
    name: Publish to npm
    needs: [npm-preflight, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Download exact npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-publication-${{ github.sha }}
          path: ${{ runner.temp }}/zigcss-npm-publication

      - name: Verify exact npm package handoff
        shell: bash
        run: |
          node scripts/npm-package-artifact.mjs verify \
            --archive "$NPM_PACKAGE_ARCHIVE" \
            --version "${GITHUB_REF_NAME#v}" \
            --expected-shasum "${{ needs.npm-preflight.outputs.npm-package-shasum }}" \
            --expected-integrity "${{ needs.npm-preflight.outputs.npm-package-integrity }}"
        env:
          NPM_PACKAGE_ARCHIVE: ${{ runner.temp }}/zigcss-npm-publication/${{ needs.npm-preflight.outputs.npm-package-archive }}

      - name: Publish to npm
        if: needs.npm-preflight.outputs.npm-already-published != 'true'
        shell: bash
        run: |
          if ! timeout 300s npm publish "$NPM_PACKAGE_ARCHIVE" --tag "$RELEASE_CHANNEL" --registry=https://registry.npmjs.org/ --provenance; then
            echo "npm publication response was inconclusive; continuing to authoritative readback" >&2
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PACKAGE_ARCHIVE: ${{ runner.temp }}/zigcss-npm-publication/${{ needs.npm-preflight.outputs.npm-package-archive }}
          RELEASE_CHANNEL: ${{ needs.npm-preflight.outputs.release-channel }}

      - name: Verify npm publication
        run: node scripts/verify-npm-publication.mjs --version "${GITHUB_REF_NAME#v}" --archive "$NPM_PACKAGE_ARCHIVE"
        env:
          NPM_PACKAGE_ARCHIVE: ${{ runner.temp }}/zigcss-npm-publication/${{ needs.npm-preflight.outputs.npm-package-archive }}

  anonymous-public-delivery:
    name: Verify Anonymous Public Delivery
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout verification source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'

      - name: Smoke anonymous canonical npm delivery
        run: node scripts/smoke-public-delivery.mjs --version "${GITHUB_REF_NAME#v}"
