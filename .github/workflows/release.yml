name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-linux
            zig-version: 0.15.2
            binary-name: zigcss
          - os: ubuntu-latest
            arch: aarch64
            target: aarch64-linux
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-latest
            arch: x86_64
            target: x86_64-macos
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-latest
            arch: aarch64
            target: aarch64-macos
            zig-version: 0.15.2
            binary-name: zigcss
          - os: windows-latest
            arch: x86_64
            target: x86_64-windows
            zig-version: 0.15.2
            binary-name: zigcss.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.zig-version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Build Release Binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Verify Target Architecture
        run: node scripts/verify-artifact-target.mjs zig-out/bin/${{ matrix.binary-name }} ${{ matrix.target }}

      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Archive
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mkdir -p release
            cp zig-out/bin/${{ matrix.binary-name }} release/
            cd release
            powershell -Command "Compress-Archive -Path '${{ matrix.binary-name }}' -DestinationPath '../zigcss-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.zip' -Force"
            cd ..
          else
            mkdir -p release
            cp zig-out/bin/${{ matrix.binary-name }} release/
            cd release
            tar czf ../zigcss-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.tar.gz ${{ matrix.binary-name }}
            cd ..
          fi

      - name: Upload Release Asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zigcss-${{ matrix.target }}
          path: zigcss-${{ steps.version.outputs.VERSION }}-${{ matrix.target }}.*

  create-release:
    name: Create Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: artifacts/**/*
          body: |
            ## zigcss ${{ steps.version.outputs.VERSION }}

            Experimental recovery binaries for development and evaluation only.

            ZigCSS 0.3 has a tested experimental grammar boundary but is not suitable for production stylesheets.

            ### Installation

            Download the appropriate binary for your platform and add it to your PATH.

            ### Supported Platforms

            - Linux (x86_64, aarch64)
            - macOS (x86_64, aarch64)
            - Windows (x86_64)

            Optimizer transforms, CLI source-map output, browser targeting, alternate format adapters, and the public compile API remain disabled or unavailable. Public performance comparisons are withdrawn until equivalent output is validated.

          draft: false
          prerelease: true

  publish-npm:
    name: Publish to npm
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
