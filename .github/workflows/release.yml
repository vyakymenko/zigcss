name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  npm-preflight:
    name: Verify npm Publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify synchronized release version for publication
        run: npm run check:version -- --tag "$GITHUB_REF_NAME"

      - name: Verify npm publication authority
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          versions="$RUNNER_TEMP/zigcss-npm-versions.json"
          npm whoami
          npm view zigcss versions --json > "$versions"
          node scripts/check-npm-version-availability.mjs \
            --version "$version" \
            --versions-file "$versions"

  release:
    name: Release ${{ matrix.target }}
    needs: npm-preflight
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-linux
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-linux
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-macos
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-15
            arch: aarch64
            target: aarch64-macos
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: windows-latest
            arch: x86_64
            target: x86_64-windows
            archive-extension: zip
            zig-version: 0.15.2
            binary-name: zigcss.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.zig-version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Verify synchronized release version
        shell: bash
        run: |
          npm run check:version -- --tag "$GITHUB_REF_NAME"
          npm run check:release-metadata

      - name: Build Release Binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Verify Target Architecture
        run: node scripts/verify-artifact-target.mjs zig-out/bin/${{ matrix.binary-name }} ${{ matrix.target }}

      - name: Plan Release Assets
        shell: bash
        run: |
          base="zigcss-${GITHUB_REF_NAME}-${{ matrix.target }}"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "RELEASE_BASE=$base" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=$base.${{ matrix.archive-extension }}" >> "$GITHUB_ENV"
          echo "RELEASE_SBOM=$base.spdx.json" >> "$GITHUB_ENV"
          echo "RELEASE_CHECKSUMS=$base.sha256" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Create Archive
        shell: bash
        run: |
          mkdir -p release-assets/staging
          cp "zig-out/bin/${{ matrix.binary-name }}" release-assets/staging/
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            (
              cd release-assets/staging
              powershell -NoProfile -Command "Compress-Archive -LiteralPath '${{ matrix.binary-name }}' -DestinationPath '../$RELEASE_ARCHIVE' -Force"
            )
          else
            COPYFILE_DISABLE=1 tar -czf "release-assets/$RELEASE_ARCHIVE" \
              -C release-assets/staging "${{ matrix.binary-name }}"
          fi
          rm -rf release-assets/staging

      - name: Generate SHA-256 Manifest and SPDX SBOM
        shell: bash
        run: |
          node scripts/generate-release-metadata.mjs --write \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Verify Release Metadata
        shell: bash
        run: |
          node scripts/generate-release-metadata.mjs --check \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Smoke Native Archive and npm Installation
        shell: bash
        run: |
          node scripts/smoke-release-artifact.mjs \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION"

      - name: Attest Release Provenance
        id: provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            release-assets/${{ env.RELEASE_ARCHIVE }}
            release-assets/${{ env.RELEASE_SBOM }}
            release-assets/${{ env.RELEASE_CHECKSUMS }}

      - name: Attest Release SBOM
        id: sbom-attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-assets/${{ env.RELEASE_ARCHIVE }}
          sbom-path: release-assets/${{ env.RELEASE_SBOM }}

      - name: Preserve Signed Attestation Bundles
        shell: bash
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "release-assets/${RELEASE_BASE}.provenance.sigstore.jsonl"
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            "release-assets/${RELEASE_BASE}.sbom.sigstore.jsonl"

      - name: Verify Signed Attestation Bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/generate-release-metadata.mjs --check-bundles \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          gh attestation verify "release-assets/$RELEASE_ARCHIVE" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "release-assets/${RELEASE_BASE}.provenance.sigstore.jsonl"
          gh attestation verify "release-assets/$RELEASE_ARCHIVE" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "release-assets/${RELEASE_BASE}.sbom.sigstore.jsonl" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Upload Release Assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zigcss-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: artifacts/**/*
          body: |
            ## zigcss ${{ steps.version.outputs.VERSION }}

            Experimental recovery binaries for development and evaluation only.

            This prerelease has a tested experimental grammar boundary but is not suitable for production stylesheets.

            Each platform archive is accompanied by a SHA-256 manifest, an SPDX 2.3 SBOM, a Sigstore-signed SLSA provenance bundle, and a signed SBOM bundle. Verify the downloaded archive against both its checksum manifest and GitHub artifact attestation before use.

            ### Installation

            Download the appropriate binary for your platform and add it to your PATH.

            ### Supported Platforms

            - Linux (x86_64, aarch64)
            - macOS (x86_64, aarch64)
            - Windows (x86_64)

            Optimizer transforms, CLI source-map output, browser targeting, alternate format adapters, and the public compile API remain disabled or unavailable. Public performance comparisons are withdrawn until a controlled scheduled archive is selected and reproduced by the BENCH-007 publication gate.

          draft: false
          prerelease: true

  publish-npm:
    name: Publish to npm
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --tag next --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm prerelease publication
        run: node scripts/verify-npm-publication.mjs --version "${GITHUB_REF_NAME#v}"
