name: Build

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-linux
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-linux
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-macos
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-15
            arch: aarch64
            target: aarch64-macos
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: windows-latest
            arch: x86_64
            target: x86_64-windows
            archive-extension: zip
            zig-version: 0.15.2
            binary-name: zigcss.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: ${{ matrix.zig-version }}

      - name: Run Native Tests
        run: node scripts/run-zig-test-suite.mjs --mode ReleaseSafe

      - name: Build Target Binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Verify Target Architecture
        run: node scripts/verify-artifact-target.mjs zig-out/bin/${{ matrix.binary-name }} ${{ matrix.target }}

      - name: Build Native Release Binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Verify Native Release Architecture
        run: node scripts/verify-artifact-target.mjs zig-out/bin/${{ matrix.binary-name }} ${{ matrix.target }}

      - name: Plan Native Smoke Assets
        shell: bash
        run: |
          version="$(cat VERSION)"
          base="zigcss-v${version}-${{ matrix.target }}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_BASE=$base" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=$base.${{ matrix.archive-extension }}" >> "$GITHUB_ENV"
          echo "RELEASE_SBOM=$base.spdx.json" >> "$GITHUB_ENV"
          echo "RELEASE_CHECKSUMS=$base.sha256" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Create Native Smoke Archive
        shell: bash
        run: |
          mkdir -p release-assets/staging
          cp "zig-out/bin/${{ matrix.binary-name }}" release-assets/staging/
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            (
              cd release-assets/staging
              powershell -NoProfile -Command "Compress-Archive -LiteralPath '${{ matrix.binary-name }}' -DestinationPath '../$RELEASE_ARCHIVE' -Force"
            )
          else
            COPYFILE_DISABLE=1 tar -czf "release-assets/$RELEASE_ARCHIVE" \
              -C release-assets/staging "${{ matrix.binary-name }}"
          fi
          rm -rf release-assets/staging

      - name: Generate Native Smoke Metadata
        shell: bash
        run: |
          node scripts/generate-release-metadata.mjs --write \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          node scripts/generate-release-metadata.mjs --check \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Smoke Native Archive and npm Installation
        shell: bash
        run: |
          node scripts/smoke-release-artifact.mjs \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --evidence "native-target-evidence/${{ matrix.target }}.json"

      - name: Upload Native Release Inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-${{ matrix.target }}
          path: |
            release-assets/${{ env.RELEASE_ARCHIVE }}
            release-assets/${{ env.RELEASE_SBOM }}
            release-assets/${{ env.RELEASE_CHECKSUMS }}
            zig-out/bin/${{ matrix.binary-name }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zigcss-${{ matrix.target }}
          path: |
            zig-out/bin/${{ matrix.binary-name }}
            native-target-evidence/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Bound Zig cache
        if: always()
        run: node .github/actions/setup-zig/setup-zig.mjs --prune-cache

  native-provenance-evidence:
    name: Native Provenance ${{ matrix.target }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            archive-extension: tar.gz
            binary-name: zigcss
          - target: aarch64-linux
            archive-extension: tar.gz
            binary-name: zigcss
          - target: x86_64-macos
            archive-extension: tar.gz
            binary-name: zigcss
          - target: aarch64-macos
            archive-extension: tar.gz
            binary-name: zigcss
          - target: x86_64-windows
            archive-extension: zip
            binary-name: zigcss.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'

      - name: Download Native Release Inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-release-${{ matrix.target }}
          path: .

      - name: Plan Native Provenance Assets
        shell: bash
        run: |
          version="$(cat VERSION)"
          base="zigcss-v${version}-${{ matrix.target }}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_BASE=$base" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=$base.${{ matrix.archive-extension }}" >> "$GITHUB_ENV"
          echo "RELEASE_SBOM=$base.spdx.json" >> "$GITHUB_ENV"
          echo "RELEASE_CHECKSUMS=$base.sha256" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Verify Native Release Inputs
        shell: bash
        run: |
          node scripts/generate-release-metadata.mjs --check \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Attest Native Provenance
        id: provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            release-assets/${{ env.RELEASE_ARCHIVE }}
            release-assets/${{ env.RELEASE_SBOM }}
            release-assets/${{ env.RELEASE_CHECKSUMS }}

      - name: Attest Native SBOM
        id: sbom-attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release-assets/${{ env.RELEASE_ARCHIVE }}
          sbom-path: release-assets/${{ env.RELEASE_SBOM }}

      - name: Preserve Native Attestation Bundles
        shell: bash
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "release-assets/${RELEASE_BASE}.provenance.sigstore.jsonl"
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            "release-assets/${RELEASE_BASE}.sbom.sigstore.jsonl"

      - name: Verify Native Attestation Bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/generate-release-metadata.mjs --check-bundles \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          gh attestation verify "release-assets/$RELEASE_ARCHIVE" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "release-assets/${RELEASE_BASE}.provenance.sigstore.jsonl" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"
          gh attestation verify "release-assets/$RELEASE_ARCHIVE" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "release-assets/${RELEASE_BASE}.sbom.sigstore.jsonl" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"

      - name: Upload Native Provenance Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-provenance-${{ matrix.target }}
          path: |
            release-assets/${{ env.RELEASE_ARCHIVE }}
            release-assets/${{ env.RELEASE_SBOM }}
            release-assets/${{ env.RELEASE_CHECKSUMS }}
            release-assets/${{ env.RELEASE_BASE }}.provenance.sigstore.jsonl
            release-assets/${{ env.RELEASE_BASE }}.sbom.sigstore.jsonl
          if-no-files-found: error
          retention-days: 7

  native-package-evidence:
    name: Native Package Evidence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'

      - name: Download Native Target Evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zigcss-*
          path: native-target-artifacts
          merge-multiple: false

      - name: Validate Native Package Evidence
        shell: bash
        run: |
          version="$(cat VERSION)"
          node scripts/validate-native-package-evidence.mjs \
            --artifacts native-target-artifacts \
            --commit "$GITHUB_SHA" \
            --version "$version" \
            --output native-package-evidence.json

      - name: Upload Native Package Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zigcss-native-package-evidence
          path: native-package-evidence.json
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: 0.15.2

      - name: Verify workflow security policy
        run: npm run test:workflows && npm run check:workflows

      - name: Verify release version policy
        run: npm run test:version && npm run check:version

      - name: Verify release artifact metadata policy
        run: npm run test:release-metadata && npm run check:release-metadata && npm run test:npm-publication

      - name: Verify native zero-dependency migration contract
        run: npm run test:native-contract && npm run test:native-package-evidence && npm run check:native-contract

      - name: Verify stable release promotion policy
        run: npm run test:stable-release && npm run check:stable-release

      - name: Test release smoke
        run: npm run test:release-smoke

      - name: Test release consumers
        run: npm run test:release-consumers

      - name: Test release container
        run: npm run test:release-container

      - name: Test release Homebrew
        run: npm run test:release-homebrew

      - name: Verify native zero-dependency package
        run: npm run test:preprocessor-package && npm run check:preprocessor-package

      - name: Install independent validator
        run: npm ci --ignore-scripts

      - name: Install VS Code extension dependencies
        working-directory: vscode-extension
        run: npm ci --ignore-scripts

      - name: Verify dependency policy and production audits
        run: npm run test:dependencies && npm run audit:production

      - name: Test and package VS Code extension
        working-directory: vscode-extension
        run: npm test && npm run package:check

      - name: Test prefix compatibility data generator
        run: npm run test:prefix-data

      - name: Verify generated prefix compatibility data
        run: npm run check:prefix-data

      - name: Test and verify generated capability status
        run: npm run test:capability-status && npm run check:capability-status

      - name: Run Tests
        run: node scripts/run-zig-test-suite.mjs --mode Debug

      - name: Install pinned Neovim clients
        run: |
          install_neovim() {
            version="$1"
            checksum="$2"
            archive="$RUNNER_TEMP/nvim-$version.tar.gz"
            destination="$RUNNER_TEMP/nvim-$version"
            curl --fail --location --retry 3 --output "$archive" \
              "https://github.com/neovim/neovim/releases/download/v$version/nvim-linux-x86_64.tar.gz"
            echo "$checksum  $archive" | sha256sum --check
            mkdir --parents "$destination"
            tar --extract --gzip --strip-components=1 --file "$archive" --directory "$destination"
          }
          install_neovim 0.11.7 38a7c6317f94503841096c00e8fde05ef04b9472fc9d7d62b6e033cecd6f7991
          install_neovim 0.12.4 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628

      - name: Validate Neovim configuration and LSP integration
        run: |
          NVIM="$RUNNER_TEMP/nvim-0.11.7/bin/nvim" NEOVIM_TEST_VERSION=0.11.7 npm run test:neovim
          NVIM="$RUNNER_TEMP/nvim-0.12.4/bin/nvim" NEOVIM_TEST_VERSION=0.12.4 npm run test:neovim

      - name: Validate documentation links and examples
        env:
          NVIM: ${{ runner.temp }}/nvim-0.11.7/bin/nvim
        run: npm run test:documentation && npm run check:documentation

      - name: Verify Zig package metadata
        run: npm run test:zig-package

      - name: Verify npm CLI wrapper
        run: npm run test:node-wrapper

      - name: Verify bounded preprocessor host
        run: npm run test:preprocessor-host

      - name: Verify confined preprocessor resolver
        run: npm run test:preprocessor-resolver

      - name: Verify preprocessor result metadata and maps
        run: npm run test:preprocessor-metadata

      - name: Verify internal Dart Sass adapter
        run: npm run test:preprocessor-sass

      - name: Verify internal Less adapter
        run: npm run test:preprocessor-less

      - name: Verify internal Stylus adapter
        run: npm run test:preprocessor-stylus

      - name: Verify canonical preprocessor product API and CLI
        run: npm run test:preprocessor-product

      - name: Verify experimental format matrix
        run: npm run test:formats

      - name: Test Zig package consumer
        working-directory: tests/package-consumer
        run: zig build test --summary all

      - name: Test build integration example
        working-directory: examples/build-integration
        run: zig build test --summary all

      - name: Test build integration example (ReleaseSafe)
        working-directory: examples/build-integration
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Validate emitted CSS independently
        run: npm run test:compat

      - name: Validate transforms independently
        run: npm run test:transforms

      - name: Validate benchmark corpora
        run: npm run test:benchmark-corpora && npm run check:benchmark-corpora

      - name: Validate benchmark toolchain
        run: npm run test:benchmark-tools && npm run check:benchmark-tools

      - name: Validate benchmark outputs
        run: npm run test:benchmark-output && npm run check:benchmark-output

      - name: Validate benchmark modes
        run: npm run test:benchmark-modes && npm run check:benchmark-modes

      - name: Run validated benchmark smoke
        run: zig build bench

      - name: Build optimized benchmark executables
        run: |
          zig build -Doptimize=ReleaseFast
          zig build install-benchmark-runner -Doptimize=ReleaseFast

      - name: Validate benchmark statistics
        run: npm run test:benchmark-statistics && npm run check:benchmark-statistics

      - name: Validate benchmark archive policy
        run: npm run test:benchmark-archive && npm run check:benchmark-archive

      - name: Validate benchmark publication
        run: npm run test:benchmark-publication && npm run check:benchmark-publication

      - name: Bound Zig cache
        if: always()
        run: node .github/actions/setup-zig/setup-zig.mjs --prune-cache
