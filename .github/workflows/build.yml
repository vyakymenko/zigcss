name: Build

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-linux
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-linux
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-macos
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: macos-latest
            arch: aarch64
            target: aarch64-macos
            archive-extension: tar.gz
            zig-version: 0.15.2
            binary-name: zigcss
          - os: windows-latest
            arch: x86_64
            target: x86_64-windows
            archive-extension: zip
            zig-version: 0.15.2
            binary-name: zigcss.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ matrix.zig-version }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run Native Tests
        run: zig build test --summary all

      - name: Build Target Binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Verify Target Architecture
        run: node scripts/verify-artifact-target.mjs zig-out/bin/${{ matrix.binary-name }} ${{ matrix.target }}

      - name: Build Native Release Binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Verify Native Release Architecture
        run: node scripts/verify-artifact-target.mjs zig-out/bin/${{ matrix.binary-name }} ${{ matrix.target }}

      - name: Plan Native Smoke Assets
        shell: bash
        run: |
          version="$(cat VERSION)"
          base="zigcss-v${version}-${{ matrix.target }}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=$base.${{ matrix.archive-extension }}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Create Native Smoke Archive
        shell: bash
        run: |
          mkdir -p release-assets/staging
          cp "zig-out/bin/${{ matrix.binary-name }}" release-assets/staging/
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            (
              cd release-assets/staging
              powershell -NoProfile -Command "Compress-Archive -LiteralPath '${{ matrix.binary-name }}' -DestinationPath '../$RELEASE_ARCHIVE' -Force"
            )
          else
            COPYFILE_DISABLE=1 tar -czf "release-assets/$RELEASE_ARCHIVE" \
              -C release-assets/staging "${{ matrix.binary-name }}"
          fi
          rm -rf release-assets/staging

      - name: Generate Native Smoke Metadata
        shell: bash
        run: |
          node scripts/generate-release-metadata.mjs --write \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
          node scripts/generate-release-metadata.mjs --check \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --output-directory release-assets \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Smoke Native Archive and npm Installation
        shell: bash
        run: |
          node scripts/smoke-release-artifact.mjs \
            --archive "release-assets/$RELEASE_ARCHIVE" \
            --binary "zig-out/bin/${{ matrix.binary-name }}" \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zigcss-${{ matrix.target }}
          path: zig-out/bin/${{ matrix.binary-name }}
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Verify workflow security policy
        run: npm run test:workflows && npm run check:workflows

      - name: Verify release version policy
        run: npm run test:version && npm run check:version

      - name: Verify release artifact metadata policy
        run: npm run test:release-metadata && npm run check:release-metadata

      - name: Test release consumer paths
        run: npm run test:release-smoke && npm run test:release-consumers && npm run test:release-container && npm run test:release-homebrew

      - name: Install independent validator
        run: npm ci --ignore-scripts

      - name: Install VS Code extension dependencies
        working-directory: vscode-extension
        run: npm ci --ignore-scripts

      - name: Verify dependency policy and production audits
        run: npm run test:dependencies && npm run audit:production

      - name: Test and package VS Code extension
        working-directory: vscode-extension
        run: npm test && npm run package:check

      - name: Test prefix compatibility data generator
        run: npm run test:prefix-data

      - name: Verify generated prefix compatibility data
        run: npm run check:prefix-data

      - name: Test and verify generated capability status
        run: npm run test:capability-status && npm run check:capability-status

      - name: Run Tests
        run: zig build test --summary all

      - name: Install pinned Neovim clients
        run: |
          install_neovim() {
            version="$1"
            checksum="$2"
            archive="$RUNNER_TEMP/nvim-$version.tar.gz"
            destination="$RUNNER_TEMP/nvim-$version"
            curl --fail --location --retry 3 --output "$archive" \
              "https://github.com/neovim/neovim/releases/download/v$version/nvim-linux-x86_64.tar.gz"
            echo "$checksum  $archive" | sha256sum --check
            mkdir --parents "$destination"
            tar --extract --gzip --strip-components=1 --file "$archive" --directory "$destination"
          }
          install_neovim 0.11.7 38a7c6317f94503841096c00e8fde05ef04b9472fc9d7d62b6e033cecd6f7991
          install_neovim 0.12.4 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628

      - name: Validate Neovim configuration and LSP integration
        run: |
          NVIM="$RUNNER_TEMP/nvim-0.11.7/bin/nvim" NEOVIM_TEST_VERSION=0.11.7 npm run test:neovim
          NVIM="$RUNNER_TEMP/nvim-0.12.4/bin/nvim" NEOVIM_TEST_VERSION=0.12.4 npm run test:neovim

      - name: Validate documentation links and examples
        env:
          NVIM: ${{ runner.temp }}/nvim-0.11.7/bin/nvim
        run: npm run test:documentation && npm run check:documentation

      - name: Verify Zig package metadata
        run: npm run test:zig-package

      - name: Verify npm CLI wrapper
        run: npm run test:node-wrapper

      - name: Verify experimental format matrix
        run: npm run test:formats

      - name: Test Zig package consumer
        working-directory: tests/package-consumer
        run: zig build test --summary all

      - name: Test build integration example
        working-directory: examples/build-integration
        run: zig build test --summary all

      - name: Test build integration example (ReleaseSafe)
        working-directory: examples/build-integration
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Validate emitted CSS independently
        run: npm run test:compat

      - name: Validate transforms independently
        run: npm run test:transforms

      - name: Run Benchmarks
        run: zig build bench
