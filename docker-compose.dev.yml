services:
  dev:
    build:
      context: .
    ports:
      - "5173:5173"
    volumes:
      # Persist Zig build cache (avoids polluting host with Linux artifacts)
      - zig-cache:/app/zig-cache
      - dot-zig-cache:/app/.zig-cache
      - zig-out:/app/zig-out
      # Preserve container's node_modules (installed during build)
      - docs-node-modules:/app/docs/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_BASE=/

volumes:
  zig-cache:
  dot-zig-cache:
  zig-out:
  docs-node-modules:
