<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>error: route not found — exit 2</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0b110d; color: #eef5ec; font-family: monospace; }
      main { width: min(44rem, calc(100% - 3rem)); border: 1px solid rgba(183,243,74,.3); padding: 2rem; }
      p:first-child { color: #b7f34a; }
      p:last-child { color: #829080; }
    </style>
    <script>
      (function redirectGitHubPagesRoute(location) {
        var pathSegmentsToKeep = 1;
        var repositoryRoot = location.pathname
          .split("/")
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/");
        var route = location.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~");
        location.replace(
          location.protocol + "//" + location.hostname + (location.port ? ":" + location.port : "") +
          repositoryRoot + "/?/" + route +
          (location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "") +
          location.hash
        );
      })(window.location);
    </script>
  </head>
  <body>
    <main>
      <p>error: route not found — exit 2</p>
      <p>recovering the admitted application route</p>
    </main>
  </body>
</html>
