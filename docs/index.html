    <script>
      (function restoreGitHubPagesRoute(location) {
        if (location.search.slice(0, 2) !== "?/") return;
        var decoded = location.search
          .slice(1)
          .split("&")
          .map(function restoreAmpersand(value) { return value.replace(/~and~/g, "&"); })
          .join("?");
        window.history.replaceState(null, "", location.pathname.slice(0, -1) + decoded + location.hash);
      })(window.location);
    </script>

        <h1 style="max-width:16ch;font-family:system-ui,sans-serif;font-size:clamp(3rem,10vw,8rem);line-height:.82;letter-spacing:-.07em">Exact in. Deterministic out. Denied by default.</h1>
        <p style="font-size:1.25rem">Compile CSS. Keep the meaning.</p>
        <p style="max-width:58rem;line-height:1.8;color:#91a08f">CSS, SCSS, indented Sass, Less, and Stylus enter one fail-closed compiler contract. Version 0.6.0-rc.2 is published as an experimental GitHub prerelease and on npm next; npm latest remains stable. Evaluate before production.</p>
        <pre style="margin-top:2rem;border:1px solid #50672d;background:#080d0a;padding:1.25rem;overflow:auto;color:#b7f34a">npm install --save-dev zigcss@next</pre>
